name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: ./tools/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tondar-linux
          path: build/*.deb

  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            unzip
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-gcc
            make
            diffutils

      - uses: actions/cache@v4
        with:
          path: build/ffmpeg
          key: ffmpeg-windows-${{ hashFiles('tools/build-ffmpeg.sh') }}

      - name: Build a small ffmpeg (merge/remux only)
        run: '[ -f build/ffmpeg/ffmpeg.exe ] || tools/build-ffmpeg.sh build/ffmpeg'

      - name: Install PyInstaller
        run: |
          pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-pyinstaller mingw-w64-ucrt-x86_64-pyinstaller-hooks-contrib \
            || pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-python-pyinstaller mingw-w64-ucrt-x86_64-python-pyinstaller-hooks-contrib \
            || python -m pip install --break-system-packages pyinstaller pyinstaller-hooks-contrib
          pyinstaller --version

      - name: Check the app imports
        run: |
          cd src
          python -c "import gi; gi.require_version('Gtk','4.0'); gi.require_version('Adw','1'); from gi.repository import Gtk, Adw; import tondar.app; print('GTK', Gtk.get_major_version(), Gtk.get_minor_version(), 'Adw', Adw.get_major_version(), Adw.get_minor_version())"

      - name: Build app
        run: |
          python tools/build-extension.py
          pyinstaller --noconfirm windows/tondar.spec

      - name: Bundle yt-dlp, ffmpeg, extension
        run: |
          mkdir -p dist/Tondar/tools/ffmpeg
          curl -fsSL -o dist/Tondar/tools/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          cp build/ffmpeg/ffmpeg.exe build/ffmpeg/ffprobe.exe dist/Tondar/tools/ffmpeg/
          cp -r build/extension dist/Tondar/extension
          cp windows/native-host-chrome.json windows/native-host-firefox.json dist/Tondar/
          ls dist/Tondar
          echo "Largest files:"; find dist/Tondar -type f -printf '%s %p\n' | sort -rn | head -25
          du -sh dist/Tondar

      - name: Smoke test
        run: |
          # The bridge must answer a ping from the browser.
          python -c "import json,struct,subprocess; d=json.dumps({'cmd':'ping'}).encode(); o=subprocess.run(['dist/Tondar/tondar-native-host.exe'],input=struct.pack('=I',len(d))+d,capture_output=True,timeout=60).stdout; print(o[4:])" | tee ping.txt
          grep -q '"ok": true' ping.txt

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = (Select-String -Path src/tondar/__init__.py -Pattern 'VERSION = "(.*)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$v" windows\tondar.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: tondar-windows
          path: windows/Output/Tondar-Setup-*.exe

  macos:
    name: macOS app (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4
        run: brew install gtk4 libadwaita pygobject3 adwaita-icon-theme librsvg
      - uses: actions/cache@v4
        with:
          path: build/ffmpeg
          key: ffmpeg-macos-${{ matrix.arch }}-${{ hashFiles('tools/build-ffmpeg.sh') }}
      - name: Check the app imports
        run: |
          cd src
          "$(brew --prefix)/bin/python3" -c "import gi; gi.require_version('Gtk','4.0'); gi.require_version('Adw','1'); from gi.repository import Gtk, Adw; import tondar.app; print('GTK', Gtk.get_major_version(), Gtk.get_minor_version())"
      - name: Build Tondar.app and .dmg
        run: tools/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tondar-macos-${{ matrix.arch }}
          path: build/Tondar-*.dmg

  firefox:
    name: Sign Firefox add-on
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sign with Mozilla (unlisted channel)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::Add AMO_JWT_ISSUER and AMO_JWT_SECRET under Settings → Secrets and variables → Actions"
            exit 1
          fi
          python3 tools/build-extension.py
          npx --yes web-ext@8 sign --channel=unlisted --source-dir build/extension/firefox \
            --artifacts-dir signed --approval-timeout 900000
          v=$(python3 -c "import re; print(re.search(r'^VERSION = \"(.+)\"', open('src/tondar/__init__.py').read(), re.M).group(1))")
          mv signed/*.xpi "tondar-firefox-$v.xpi"
      - uses: actions/upload-artifact@v4
        with:
          name: tondar-firefox
          path: tondar-firefox-*.xpi

  release:
    name: Publish release
    # Publish even if Firefox signing or a macOS build failed; that file is then just missing.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.linux.result == 'success' && needs.windows.result == 'success'
    needs: [linux, windows, macos, firefox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
