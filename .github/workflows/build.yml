name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: ./tools/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tondar-linux
          path: build/*.deb

  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            unzip
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            mingw-w64-ucrt-x86_64-librsvg

      - name: Install PyInstaller
        run: |
          pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-pyinstaller mingw-w64-ucrt-x86_64-pyinstaller-hooks-contrib \
            || pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-python-pyinstaller mingw-w64-ucrt-x86_64-python-pyinstaller-hooks-contrib \
            || python -m pip install --break-system-packages pyinstaller pyinstaller-hooks-contrib
          pyinstaller --version

      - name: Check the app imports
        run: |
          cd src
          python -c "import gi; gi.require_version('Gtk','4.0'); gi.require_version('Adw','1'); from gi.repository import Gtk, Adw; import tondar.app; print('GTK', Gtk.get_major_version(), Gtk.get_minor_version(), 'Adw', Adw.get_major_version(), Adw.get_minor_version())"

      - name: Build app
        run: |
          python tools/build-extension.py
          pyinstaller --noconfirm windows/tondar.spec

      - name: Bundle yt-dlp, ffmpeg, extension
        run: |
          mkdir -p dist/Tondar/tools/ffmpeg
          curl -fsSL -o dist/Tondar/tools/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          curl -fsSL -o ffmpeg.zip https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip
          unzip -q ffmpeg.zip
          cp ffmpeg-master-latest-win64-gpl-shared/bin/* dist/Tondar/tools/ffmpeg/
          cp -r build/extension dist/Tondar/extension
          cp windows/native-host-chrome.json windows/native-host-firefox.json dist/Tondar/
          ls dist/Tondar

      - name: Smoke test
        run: |
          # The bridge must answer a ping from the browser.
          python -c "import json,struct,subprocess; d=json.dumps({'cmd':'ping'}).encode(); o=subprocess.run(['dist/Tondar/tondar-native-host.exe'],input=struct.pack('=I',len(d))+d,capture_output=True,timeout=60).stdout; print(o[4:])" | tee ping.txt
          grep -q '"ok": true' ping.txt

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = (Select-String -Path src/tondar/__init__.py -Pattern 'VERSION = "(.*)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$v" windows\tondar.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: tondar-windows
          path: windows/Output/Tondar-Setup-*.exe

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
